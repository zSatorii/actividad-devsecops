version: '3.8'

services:
  web:
    build: .
    container_name: flask-api
    restart: always
    expose:
      - "5000"
    environment:
      - DB_HOST=db
      - DB_USER=appuser
      - DB_PASSWORD=appsecret
      - DB_NAME=appdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  db:
    image: mysql:8.0
    container_name: servidor-bd-ejemplo
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: appsecret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - app_net

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - app_net

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  db_data:
  npm_data:
  npm_letsencrypt:
  uptime-kuma-data:

name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Ejecutar pruebas con Pytest
        run: |
          PYTHONPATH=app pytest app/test_app.py

      # 1. Análisis Estático de Código (SAST) con Bandit
      - name: Ejecutar Bandit (Seguridad en Python)
        run: |
          pip install bandit
          bandit -r app -f txt || true

      # 2. Análisis de Vulnerabilidades en Imagen con Trivy
      - name: Escanear repositorio con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Despliegue mediante SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/actividad-devsecops
            git pull origin main
            docker compose up -d --build
